<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AI DRS — Performance Analytics Engine & Pitch Maps</title>
<link rel="stylesheet" href="/static/css/global_theme.css"/>
<script src="/static/js/global_nav.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@300;400;500;600;700&family=Rajdhani:wght@600;700&display=swap');

  :root {
    --bg: #06090f; --panel: #0b1120; --panel2: #0f1929; --border: rgba(255,255,255,.08);
    --accent: #00e5a0; --accent2: #00e5a0; --accent3: #ff6b35;
    --text: #e8f4ff; --sub: #6b8aab;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; min-height:100vh; display:flex; flex-direction:column; }

  /* ── NAV ── */
  header { background:rgba(11,17,32,.9); backdrop-filter:blur(12px); border-bottom:1px solid var(--border);
           padding:0 30px; height:64px; display:flex; align-items:center; justify-content:space-between; }
  .logo { font-family:'Orbitron',sans-serif; font-size:1.1rem; color:var(--accent); text-decoration:none; letter-spacing:.08em; }
  .nav-links { display:flex; gap:24px; }
  .nav-links a { color:var(--sub); text-decoration:none; font-size:.85rem; font-weight:600; transition:color .2s; }
  .nav-links a:hover, .nav-links a.active { color:var(--accent); }

  /* ── MAIN CONTAINER ── */
  .container { padding:30px; max-width:1400px; margin:0 auto; width:100%; }

  /* ── FILTER BAR ── */
  .filter-bar { background:var(--panel); border:1px solid var(--border); border-radius:12px;
                padding:16px 24px; display:flex; gap:20px; align-items:center; flex-wrap:wrap; margin-bottom:30px; }
  .filter-group { display:flex; align-items:center; gap:8px; }
  .filter-group label { font-size:.72rem; color:var(--sub); text-transform:uppercase; font-weight:700; letter-spacing:.08em; }
  select, input { background:rgba(255,255,255,.04); border:1px solid var(--border); border-radius:6px;
                  padding:8px 14px; color:var(--text); font-family:'Inter',sans-serif; font-size:.85rem; }
  select:focus, input:focus { outline:none; border-color:var(--accent); }
  .btn-filter { background:var(--accent); color:#000; font-weight:700; border:none; padding:8px 20px;
                border-radius:6px; cursor:pointer; font-family:'Rajdhani',sans-serif; font-size:.9rem; }
  .btn-filter:hover { background:#00ffb8; }

  /* ── GRID LAYOUT ── */
  .grid-3 { display:grid; grid-template-columns:repeat(3,1fr); gap:24px; margin-bottom:30px; }
  @media(max-width:1024px){ .grid-3 { grid-template-columns:1fr; } }

  .viz-box { background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:20px; display:flex; flex-direction:column; align-items:center; }
  .viz-title { font-family:'Rajdhani',sans-serif; font-size:1.1rem; font-weight:700; color:var(--accent); width:100%; text-align:left; margin-bottom:16px; display:flex; justify-content:space-between; align-items:center; }
  .viz-badge { font-family:'Inter',sans-serif; font-size:.7rem; color:var(--sub); background:rgba(255,255,255,.05); padding:4px 10px; border-radius:4px; font-weight:500; }

  canvas { background:#070d18; border-radius:8px; border:1px solid var(--border); max-width:100%; }

  /* ── STATS ROW ── */
  .stats-row { display:grid; grid-template-columns:repeat(4,1fr); gap:20px; margin-bottom:30px; }
  .stat-card { background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:20px; text-align:center; }
  .stat-val { font-family:'Orbitron',sans-serif; font-size:1.8rem; font-weight:900; color:var(--accent); margin-bottom:4px; }
  .stat-label { font-size:.75rem; color:var(--sub); text-transform:uppercase; letter-spacing:.08em; }

  /* ── TABLE ── */
  .table-card { background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:24px; }
  table { width:100%; border-collapse:collapse; text-align:left; font-size:.85rem; }
  th { color:var(--sub); font-size:.72rem; text-transform:uppercase; letter-spacing:.08em; padding:12px; border-bottom:1px solid var(--border); }
  td { padding:12px; border-bottom:1px solid rgba(255,255,255,.03); }
  tr:hover td { background:rgba(255,255,255,.02); }
  .tag { padding:4px 8px; border-radius:4px; font-size:.72rem; font-weight:700; text-transform:uppercase; }
  .tag-good { background:rgba(0,229,160,.15); color:var(--accent); }
  .tag-yorker { background:rgba(0,153,255,.15); color:var(--accent2); }
  .tag-wicket { background:rgba(255,107,53,.2); color:var(--accent3); }
</style>
</head>
<body>

<!-- Header rendered dynamically by global_nav.js -->

<div class="container">

  <!-- Filter Bar -->
  <div class="filter-bar">
    <div class="filter-group">
      <label>Bowler</label>
      <select id="sel-bowler" onchange="loadAnalytics()">
        <option value="">All Bowlers</option>
        <option value="Jasprit Bumrah" selected>Jasprit Bumrah</option>
        <option value="Rashid Khan">Rashid Khan</option>
      </select>
    </div>
    <div class="filter-group">
      <label>Batter</label>
      <select id="sel-batter" onchange="loadAnalytics()">
        <option value="">All Batters</option>
        <option value="Virat Kohli">Virat Kohli</option>
        <option value="Rohit Sharma">Rohit Sharma</option>
      </select>
    </div>
    <button class="btn-filter" onclick="loadAnalytics()">UPDATE ANALYTICS</button>
  </div>

  <!-- Summary Stats -->
  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-val" id="st-speed">143.1 km/h</div>
      <div class="stat-label">Avg Ball Speed</div>
    </div>
    <div class="stat-card">
      <div class="stat-val" id="st-accuracy">66.7%</div>
      <div class="stat-label">Length Accuracy</div>
    </div>
    <div class="stat-card">
      <div class="stat-val" id="st-stump">66.7%</div>
      <div class="stat-label">Stump Line Hits</div>
    </div>
    <div class="stat-card">
      <div class="stat-val" id="st-wickets" style="color:var(--accent3)">1</div>
      <div class="stat-label">Wickets Taken</div>
    </div>
  </div>

  <!-- 3 Visualizations -->
  <div class="grid-3">
    <!-- Pitch Map -->
    <div class="viz-box">
      <div class="viz-title">🏏 Pitch Map <span class="viz-badge">Top-Down Pitch</span></div>
      <canvas id="cv-pitch" width="280" height="420"></canvas>
    </div>

    <!-- Beehive -->
    <div class="viz-box">
      <div class="viz-title">🎯 Beehive Heatmap <span class="viz-badge">Stump Target</span></div>
      <canvas id="cv-beehive" width="280" height="420"></canvas>
    </div>

    <!-- Wagon Wheel -->
    <div class="viz-box">
      <div class="viz-title">⭕ Wagon Wheel <span class="viz-badge">360° Shot Vectors</span></div>
      <canvas id="cv-wagon" width="280" height="420"></canvas>
    </div>
  </div>

  <!-- Deliveries Table -->
  <div class="table-card">
    <div class="viz-title" style="margin-bottom:20px;">📋 Delivery Logs & Highlights</div>
    <table>
      <thead>
        <tr>
          <th>Delivery ID</th>
          <th>Over</th>
          <th>Bowler</th>
          <th>Batter</th>
          <th>Speed</th>
          <th>Length Zone</th>
          <th>Result</th>
        </tr>
      </thead>
      <tbody id="tb-deliveries">
        <tr><td colspan="7" style="text-align:center;color:var(--sub)">Loading delivery records...</td></tr>
      </tbody>
    </table>
  </div>

</div>

<script>
async function loadAnalytics() {
  const bowler = document.getElementById('sel-bowler').value;
  const batter = document.getElementById('sel-batter').value;

  // 1. Fetch Pitch Map
  const rPitch = await fetch(`/api/v1/analytics/pitch-map?bowler_name=${encodeURIComponent(bowler)}`);
  const dPitch = await rPitch.json();

  // 2. Fetch Beehive
  const rBee = await fetch(`/api/v1/analytics/beehive?bowler_name=${encodeURIComponent(bowler)}`);
  const dBee = await rBee.json();

  // 3. Fetch Wagon Wheel
  const rWagon = await fetch(`/api/v1/analytics/wagon-wheel?batter_name=${encodeURIComponent(batter)}`);
  const dWagon = await rWagon.json();

  // Draw Canvases
  drawPitchMap(dPitch.pitch_map.deliveries);
  drawBeehive(dBee.beehive.deliveries);
  drawWagonWheel(dWagon.wagon_wheel.deliveries);

  // Update Table & Stats
  updateTable(dPitch.pitch_map.deliveries);
  if(dPitch.pitch_map.deliveries.length > 0) {
    const list = dPitch.pitch_map.deliveries;
    const avgSpd = list.reduce((a,b)=>a+b.ball_speed_kmh, 0)/list.length;
    document.getElementById('st-speed').textContent = avgSpd.toFixed(1) + ' km/h';
    document.getElementById('st-accuracy').textContent = dPitch.pitch_map.length_accuracy_pct + '%';
    document.getElementById('st-stump').textContent = dBee.beehive.stump_hits_pct + '%';
    document.getElementById('st-wickets').textContent = list.filter(x=>x.is_wicket).length;
  }
}

function drawPitchMap(deliveries) {
  const cv = document.getElementById('cv-pitch');
  const ctx = cv.getContext('2d');
  const w = cv.width, h = cv.height;

  ctx.clearRect(0, 0, w, h);

  // Draw Pitch Outline
  ctx.strokeStyle = 'rgba(0, 229, 160, 0.4)';
  ctx.lineWidth = 2;
  ctx.strokeRect(50, 20, w - 100, h - 40);

  // Crease Lines
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(50, 80); ctx.lineTo(w - 50, 80);   // Popping crease
  ctx.moveTo(50, h - 60); ctx.lineTo(w - 50, h - 60); // Batter crease
  ctx.stroke();

  // Length Zones text
  ctx.fillStyle = 'rgba(255,255,255,0.2)';
  ctx.font = '10px Rajdhani';
  ctx.fillText('SHORT', 15, 140);
  ctx.fillText('GOOD', 15, 230);
  ctx.fillText('YORKER', 15, 330);

  // Plot Deliveries
  deliveries.forEach(d => {
    // Y mapping: 0 to 20m -> h-60 to 80
    const py = (h - 60) - (d.bounce_pitch_y_m / 20.12) * (h - 140);
    const px = w/2 + (d.bounce_pitch_x_m * 60);

    ctx.beginPath();
    ctx.arc(px, py, 7, 0, Math.PI * 2);
    ctx.fillStyle = d.is_wicket ? '#ff6b35' : '#00e5a0';
    ctx.fill();
    ctx.strokeStyle = '#000';
    ctx.stroke();
  });
}

function drawBeehive(deliveries) {
  const cv = document.getElementById('cv-beehive');
  const ctx = cv.getContext('2d');
  const w = cv.width, h = cv.height;

  ctx.clearRect(0, 0, w, h);

  // Draw Stumps
  const cx = w / 2;
  const sy = h - 80;
  ctx.fillStyle = '#ffb74d';

  // 3 Stumps
  [-20, 0, 20].forEach(x => {
    ctx.fillRect(cx + x - 3, sy - 140, 6, 140);
  });
  // Bails
  ctx.fillRect(cx - 24, sy - 146, 48, 6);

  // Plot impacts
  deliveries.forEach(d => {
    const px = cx + (d.stump_impact_x_m * 180);
    const py = sy - (d.stump_impact_z_m * 140);

    ctx.beginPath();
    ctx.arc(px, py, 7, 0, Math.PI * 2);
    ctx.fillStyle = d.is_wicket ? '#ff1744' : '#00e5a0';
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.stroke();
  });
}

function drawWagonWheel(deliveries) {
  const cv = document.getElementById('cv-wagon');
  const ctx = cv.getContext('2d');
  const w = cv.width, h = cv.height;
  const cx = w/2, cy = h/2, radius = 110;

  ctx.clearRect(0, 0, w, h);

  // Oval Boundary
  ctx.strokeStyle = 'rgba(0, 229, 160, 0.4)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(cx, cy, radius, 0, Math.PI * 2);
  ctx.stroke();

  // Pitch at center
  ctx.fillStyle = 'rgba(255,255,255,0.2)';
  ctx.fillRect(cx - 6, cy - 18, 12, 36);

  // Plot Vectors
  deliveries.forEach(d => {
    const rad = (d.shot_sector_deg - 90) * Math.PI / 180;
    const len = Math.min(d.shot_distance_m, 110);
    const ex = cx + Math.cos(rad) * len;
    const ey = cy + Math.sin(rad) * len;

    ctx.strokeStyle = d.runs_scored === 6 ? '#ff6b35' : (d.runs_scored === 4 ? '#00e5a0' : '#5a7a9a');
    ctx.lineWidth = d.runs_scored >= 4 ? 2.5 : 1.5;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(ex, ey);
    ctx.stroke();
  });
}

function updateTable(deliveries) {
  const tb = document.getElementById('tb-deliveries');
  if(!deliveries || deliveries.length === 0) {
    tb.innerHTML = '<tr><td colspan="7" style="text-align:center;color:var(--sub)">No deliveries found.</td></tr>';
    return;
  }

  tb.innerHTML = deliveries.map(d => `
    <tr>
      <td><strong>${d.delivery_id}</strong></td>
      <td>${d.over_num}.${d.ball_num}</td>
      <td>${d.bowler_name}</td>
      <td>${d.batter_name}</td>
      <td>${d.ball_speed_kmh} km/h</td>
      <td><span class="tag tag-${d.length_zone.toLowerCase()}">${d.length_zone}</span></td>
      <td>${d.is_wicket ? `<span class="tag tag-wicket">WICKET (${d.wicket_type})</span>` : `${d.runs_scored} Runs`}</td>
    </tr>
  `).join('');
}

loadAnalytics();
</script>
</body>
</html>
